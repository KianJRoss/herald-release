name: Feature request
description: Suggest a change or new capability.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: How you'd like it to work. Alternatives you considered are welcome too.
  - type: dropdown
    id: part
    attributes:
      label: Part of Herald
      options: [Router, CLI / Pi interface, Python package, TypeScript SDK, Installer, Other]
